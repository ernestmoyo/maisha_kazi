version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: maisha_kazi_db
    environment:
      POSTGRES_USER: maisha
      POSTGRES_PASSWORD: maisha_dev_2025
      POSTGRES_DB: maisha_kazi
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U maisha -d maisha_kazi']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
